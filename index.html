<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adrian.Punk</title>
  <meta name="description" content="Adrian.Punk — AI 视觉创作者、创作系统搭建者。把经验拆成问题、变量与系统，再用 AI 把想象力变成看得见的作品。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- The camera-head character; the camera dives into his lens, into a corridor of doors. -->
  <canvas id="scene" aria-label="相机头人物吹奏萨克斯的三维模型"></canvas>
  <!-- Fades to dark as the camera enters the lens. -->
  <div class="iris" id="iris" aria-hidden="true"></div>
  <!-- Inside the lens: a corridor with a door for each part of the site, contact on the far wall. -->
  <div class="room-hud micro" id="roomHud" aria-hidden="true">
    <span class="now" id="roomNow"><b>01</b> About</span>
    <span class="hint" id="roomHint">Scroll to walk</span>
  </div>
  <!-- In the About and Tools worlds: the way back out. -->
  <button type="button" class="world-back micro" id="worldBack" hidden>← 回到走廊</button>
  <dialog class="photo-box" id="photoBox" aria-label="照片">
    <img id="photoImg" src="" alt="" width="600" height="800" />
    <p class="micro"><b id="photoNo"></b><span id="photoTitle"></span></p>
    <p class="role" id="photoRole"></p>
  </dialog>
  <div class="veil" id="veil" aria-hidden="true"></div>
  <div class="cursor" id="cursor" aria-hidden="true"></div>

  <header class="hero" id="top" data-face="hero" data-bg="#fff">
    <div class="stage" id="stage">
      <div class="hero-name" id="heroName" aria-label="Adrian.Punk"><span>Adrian<span class="dot">.</span>Punk</span></div>
      <div class="hud" id="hud">
        <div class="corner tl micro brand"><i></i><span>Adrian.Punk</span></div>
        <nav class="corner tr micro" aria-label="Main">
          <ul><li><a href="#notes">About</a></li><li><a href="#tools">Tools</a></li><li><a href="#sessions">Writing</a></li><li><a href="#contact">Contact</a></li></ul>
        </nav>
        <div class="corner bl micro clock"><span class="live">●</span><span class="time" id="clock">--:--:--</span><span>Shanghai</span></div>
        <div class="corner bc micro scroll-hint"><span>Scroll into the lens</span><div class="line"></div></div>
      </div>
      <p class="loader micro" id="loader">Loading <span id="loaderPct">0</span>%</p>
    </div>
  </header>

  <!-- Behind the Writing and Parlour doors: that one page, over the corridor. Back returns to the same spot. -->
  <div class="pages" id="pages" hidden>
    <div class="page-bar micro">
      <button type="button" data-back>← 回到走廊</button>
      <span class="now" id="pageNow"></span>
      <span class="esc">Esc</span>
    </div>
  <main>
    <section id="sessions" class="sessions" data-face="sessions" data-bg="#0a0a0a">
      <div class="crate" id="crate">
        <div class="crate-head">
          <p class="label micro"><i></i>03 — Writing</p>
          <h2 class="title">写在 X 上<span class="dot">.</span></h2>
          <div class="filters micro" id="filters" role="tablist" aria-label="筛选"></div>
          <p class="micro crate-count"><span id="crateNow">01</span> / <span id="crateTotal">24</span></p>
        </div>
        <ol class="track-row" id="trackRow"></ol>
      </div>
    </section>

    <section id="parlour" class="sec parlour" data-face="parlour" data-bg="#fff">
      <div class="col">
        <p class="label micro reveal"><i></i>04 — Parlour</p>
        <h2 class="title reveal d1">约我聊一小时<span class="dot">.</span></h2>
        <ol class="rates" id="rates"></ol>
        <p class="rates-foot micro reveal"><span>CNY · 按小时计费</span><button type="button" data-qr>微信预约 →</button></p>
      </div>
    </section>
  </main>
  </div>


  <!-- The music: one line, plus a tiny copy of his LED face. -->
  <div class="player micro" id="player">
    <canvas class="mini-face" id="miniFace" width="64" height="64" aria-hidden="true"></canvas>
    <button type="button" id="play" aria-pressed="false" aria-label="播放萨克斯"><span class="ico"></span></button>
    <canvas id="wave" aria-label="音轨进度，点击跳转"></canvas>
    <span class="time" id="time">Saxlele</span>
  </div>

  <dialog class="qr" id="qr" aria-label="Adrian.Punk 微信二维码">
    <img src="/img/wechat-qr.jpg" alt="Adrian.Punk 微信二维码" width="240" height="240" />
    <p class="micro">微信扫一扫 · 添加 Adrian.Punk</p>
    <button class="micro" type="button" data-close>Close</button>
  </dialog>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
